# Cross-platform bundles can only be produced on their own OS, so a tag fans out
# to one runner per target and they all upload to the same draft release.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon and Intel .dmg are separate builds — a universal binary
          # would double every download for no gain here.
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKit dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without these the updater bundles go up unsigned and no latest.json
          # is written, so the in-app updater has nothing to fetch.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Stash ${{ github.ref_name }}
          # Placeholder only — the step below replaces this with the changelog
          # entry once the release exists. Whichever runner finishes first wins,
          # and they all write the same text.
          releaseBody: Building…
          # Published straight away: a draft is invisible to everyone but the
          # repo owner, and these tags exist so people can download the app.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # CHANGELOG.md is the single source of truth for what a version changed,
      # so the release notes are generated from it rather than written twice.
      - name: Use the changelog entry as the release notes
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          notes=$(awk -v tag="## $TAG" '
            $0 ~ "^"tag" " || $0 == tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -z "${notes// /}" ]; then
            echo "No CHANGELOG.md entry for $TAG; leaving the generated notes alone."
            notes="See the commit history for what changed in $TAG."
          fi

          cat > notes.md <<EOF
          $notes

          ---

          **Installing:** the bundles are unsigned, so macOS and Windows warn on
          first launch. [How to get past that](https://github.com/nixentric/stash/blob/main/docs/install.md#first-launch).
          EOF

          gh release edit "$TAG" --notes-file notes.md
