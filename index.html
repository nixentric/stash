<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stash</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem("stash.theme") || "system";
        const dark =
          t === "dark" ||
          (t === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        // The stylesheet lands after first paint, so colour the document here
        // too — otherwise the webview shows its white default for a frame.
        document.documentElement.style.background = dark
          ? "oklch(0.168 0.005 265)"
          : "oklch(0.994 0 0)";
      } catch {}

      // San Francisco is the right typeface on macOS and nowhere else. Rather
      // than trusting three different webviews to agree on which of
      // `-apple-system` / `ui-sans-serif` / `system-ui` resolves to what, the
      // platform is asked once, here, before anything paints.
      if (!/Mac OS X/.test(navigator.userAgent)) {
        document.documentElement.dataset.font = "flex";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
