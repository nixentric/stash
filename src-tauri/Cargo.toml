[package]
name = "stash"
version = "0.5.34"
description = "Portable visual footage catalog"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[lib]
name = "stash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.37", features = ["bundled", "backup", "functions"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }

chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
url = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
log = "0.4"
tauri-plugin-updater = "2.0.0-rc.4"
tauri-plugin-process = "2.0.0-rc.1"
# Pinned to the version usvg already pulls in, so the tree carries one copy.
fontdb = { version = "0.23", default-features = false, features = ["fs"] }
resvg = "0.45.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# HEIC is HEVC inside a HEIF box. No Rust decoder handles it and WebView2 will
# not either, so an iPhone library was a wall of broken images on Windows.
# macOS is deliberately absent below: WKWebView decodes HEIC natively, and
# leaving libheif out keeps its HEVC plugin out of the .app.
libheif-rs = { version = "2.7", default-features = false, features = ["v1_17"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
# Built from the crate's own sources rather than the distro's: Ubuntu 22.04 —
# the oldest glibc we still ship for — carries libheif 1.12 and this needs
# 1.17. HEVC comes from the system libde265 it is linked against.
libheif-rs = { version = "2.7", default-features = false, features = ["v1_17", "embedded-libheif"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# vcpkg builds libheif and its HEVC decoder into the exe on Windows, so the
# installer stays a single file with no DLLs to lose.
[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
tag = "2026.07.29"
dependencies = ["libheif[hevc]"]

[package.metadata.vcpkg.target]
x86_64-pc-windows-msvc = { triplet = "x64-windows-static-md", dependencies = ["libheif[hevc]"] }
